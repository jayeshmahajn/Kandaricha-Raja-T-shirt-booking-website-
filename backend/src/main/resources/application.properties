server.port=8081

# Where the excel file lives
app.excel.file-path=data/bookings.xlsx

# Where uploaded t-shirt design images are stored
app.upload.dir=data/images

# Admin secret - CHANGE THIS before deploying!
# The admin panel on the frontend asks for this password and sends it
# as the "X-Admin-Key" header on every upload/delete request.
app.admin.key=Ganpati@Bappa2026

# Allow large-ish uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Database Configuration (Uses env vars on deployment)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mandal_db}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cloudinary Configuration
cloudinary.url=${CLOUDINARY_URL:}

# Allow the React dev server (and your deployed frontend) to call the API
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000,https://jagruticharaja.vercel.app
